name: Release

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      MAVEN_METEOR_ALIAS: ${{ secrets.MAVEN_METEOR_ALIAS }}
      MAVEN_METEOR_TOKEN: ${{ secrets.MAVEN_METEOR_TOKEN }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4.7.0
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Checkout Baritone Dependency
        uses: actions/checkout@v4.2.2
        with:
          repository: canonrebel04/baritone-v2
          ref: 26.1
          path: baritone-v2

      - name: Build and Publish Baritone to MavenLocal
        run: |
          cd baritone-v2
          chmod +x gradlew
          ./gradlew build --no-daemon
          ./gradlew publishToMavenLocal --no-daemon
          cd ..

      - name: Set up Node JS
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Get current version
        id: version
        run: |
          cd .github/builds
          npm install
          npm run --silent get_version >> $GITHUB_OUTPUT

      - name: Build
        run: ./gradlew build -Pversion=${{ steps.version.outputs.version }}

      - name: Create Release
        uses: ncipollo/release-action@v1.12.0
        with:
          artifacts: "build/libs/*"
          prerelease: true
          makeLatest: true
          body: "This version supports Minecraft ${{ steps.version.outputs.mc_version }}."
          name: "Meteor Client ${{ steps.version.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Webhook Failure
        if: ${{ failure() && env.DISCORD_WEBHOOK != '' }}
        run: |
          cd .github/builds
          npm run webhook -- ${{ steps.version.outputs.version }} false false true

      - name: Publish
        if: ${{ env.MAVEN_METEOR_ALIAS != '' && env.MAVEN_METEOR_TOKEN != '' }}
        run: ./gradlew publish -Pversion=${{ steps.version.outputs.version }}

      - name: Discord webhook
        if: ${{ env.DISCORD_WEBHOOK != '' }}
        run: |
          cd .github/builds
          npm run webhook -- ${{ steps.version.outputs.version }} true false true
