name: Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Meteor
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build Meteor + Baritone
        id: build
        uses: ./.github/actions/build-pair
        with:
          baritone-ref: "26.1"
          build-number: build.${{ github.run_number }}

      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: meteor-baritone-build.${{ github.run_number }}
          path: |
            ${{ steps.build.outputs.meteor-jar }}
            ${{ steps.build.outputs.baritone-jar }}
          retention-days: 30
