name: Pull Request

on:
  pull_request:

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Meteor
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build Meteor + Baritone
        id: build
        uses: ./.github/actions/build-pair
        with:
          baritone-ref: "26.3"
          build-number: pr${{ github.event.pull_request.number }}.${{ github.run_number }}

      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: meteor-baritone-pr${{ github.event.pull_request.number }}.${{ github.run_number }}
          path: |
            ${{ steps.build.outputs.meteor-jar }}
            ${{ steps.build.outputs.baritone-jar }}
          retention-days: 14
