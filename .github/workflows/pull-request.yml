name: Build Pull Request

on: [ pull_request ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      - name: Checkout Baritone Dependency
        uses: actions/checkout@v4
        with:
          repository: canonrebel04/baritone-v2
          ref: 26.1
          path: baritone-v2

      - name: Build and Publish Baritone to MavenLocal
        run: |
          cd baritone-v2
          chmod +x gradlew
          ./gradlew build --no-daemon
          ./gradlew publishToMavenLocal --no-daemon
          cd ..

      - name: Build
        run: ./gradlew build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pull-request-build
          path: build/libs/
